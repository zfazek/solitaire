# Add inside the <VirtualHost *:443> block of
# /etc/apache2/sites-enabled/000-default-le-ssl.conf.
# mod_proxy and mod_proxy_http are already enabled, and mod_proxy sets
# X-Forwarded-For itself.
ProxyPreserveHost On
ProxyPass        /solitaire/seed/ http://127.0.0.1:3000/seed/ timeout=30
ProxyPassReverse /solitaire/seed/ http://127.0.0.1:3000/seed/
